name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before building installers.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint:fsd

      - run: npm run lint:structure

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses unless an
      # AppArmor profile allows the binary (the .deb installs one). Playwright's Chromium and
      # Electron from node_modules have none.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The engine and iframe tests run against real Chromium.
      - name: Install Chromium for the integration tests
        run: npx playwright-core install --with-deps chromium

      - run: npm test

      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e
