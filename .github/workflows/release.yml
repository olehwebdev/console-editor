name: Release

# Builds the installers on macOS, Windows and Linux, installs each one on a
# runner of its architecture and runs the packaged-app smoke test against the
# installed app, updates the installed Windows app and the AppImage to a newer
# build, then drafts a GitHub release whose notes start with the version's
# CHANGELOG.md section.
#
#   - Push a tag vX.Y.Z (matching package.json) to build and draft that release.
#   - Or run it by hand: it builds and tests the installers (downloadable from
#     the run), and with "draft release" ticked also drafts vX.Y.Z from
#     package.json. Its tag is created when you publish the draft.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: Also draft a GitHub release with the installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      next: ${{ steps.version.outputs.next }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json's version ($version)."
            exit 1
          fi
          # Published releases only (this token can't see drafts); anything but "not found" is an error.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --silent 2> "$RUNNER_TEMP/err"; then
            released=true
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
            released=false
          else
            cat "$RUNNER_TEMP/err"
            exit 1
          fi
          # Publishing a drafted release creates its tag, which can start this workflow again.
          if [ "$released" = true ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::notice::v$version is already released; nothing to build."
          fi
          if [ "$released" = true ] && [ "$DRAFT_RELEASE" = true ]; then
            echo "::error::v$version is already released. Bump the version in package.json first."
            exit 1
          fi
          # A release's notes (and the app's What's New) come from its CHANGELOG.md section: check it before building.
          if [ "$released" != true ] && { [ "$GITHUB_REF_TYPE" = tag ] || [ "$DRAFT_RELEASE" = true ]; }; then
            node --no-warnings scripts/release-notes.ts "$version" > /dev/null
          fi
          # The update tests install a build numbered one patch above this one.
          next=$(echo "$version" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    if: needs.prepare.outputs.released != 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  installers:
    name: Installers (${{ matrix.name }})
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Apple silicon and Intel disk images, signed ad hoc (see electron-builder.ts).
      - name: Package
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      # One installer per architecture (a combined one would be twice the download), built in one run so
      # latest.yml lists both.
      - name: Package
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --arm64 --publish never

      - name: Package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          npx electron-builder --linux --x64 --arm64 --publish never

      # latest*.yml tell installed copies about the release; the block maps let them download only what changed.
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          # Installers are compressed already.
          compression-level: 0

      # The same app numbered one patch higher, for the update tests to install. Never released.
      - name: Package a newer build to update to
        if: runner.os != 'macOS'
        env:
          NEXT: ${{ needs.prepare.outputs.next }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then targets='--win --x64 --arm64'; else targets='--linux AppImage --x64 --arm64'; fi
          npx electron-builder $targets --publish never -c.directories.output=dist-next -c.extraMetadata.version="$NEXT"

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: update-test-${{ runner.os }}
          path: |
            dist-next/*-setup.exe
            dist-next/*.AppImage
            dist-next/latest*.yml
            dist-next/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # Installs each installer the way a user would, on a runner of its own architecture, and runs the
  # packaged-app smoke test against the installed app.
  test:
    name: Test (${{ matrix.name }})
    needs: installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            os: macos-latest
            installers: installers-macOS
          - name: macOS, Intel
            os: macos-26-intel
            installers: installers-macOS
          - name: Windows x64
            os: windows-latest
            installers: installers-Windows
          - name: Windows on ARM
            os: windows-11-arm
            installers: installers-Windows
          - name: Linux x64
            os: ubuntu-latest
            installers: installers-Linux
          - name: Linux arm64
            os: ubuntu-24.04-arm
            installers: installers-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # For the smoke test's Playwright; the app under test is the installed one.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.installers }}
          path: dist

      - uses: actions/download-artifact@v8
        if: runner.os != 'macOS'
        with:
          name: update-test-${{ runner.os }}
          path: dist-next

      - name: Install the disk image and test the app
        if: runner.os == 'macOS'
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/console-editor-*-mac-$arch.dmg
          cp -R "$RUNNER_TEMP/dmg/Console Editor.app" "$RUNNER_TEMP/"
          # Spotlight can still be reading the fresh volume.
          hdiutil detach "$RUNNER_TEMP/dmg" || { sleep 3; hdiutil detach -force "$RUNNER_TEMP/dmg"; }
          codesign --verify --deep --strict "$RUNNER_TEMP/Console Editor.app"
          npm run test:packaged -- "$RUNNER_TEMP/Console Editor.app/Contents/MacOS/Console Editor"

      - name: Install and test the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          if ($arch -eq 'x64') {
            # The ARM installer must refuse an x64 PC rather than leave shortcuts to nothing.
            $arm = Get-ChildItem dist -Filter 'console-editor-*-win-arm64-setup.exe' | Select-Object -First 1
            $refused = Start-Process -FilePath $arm.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
            if ($refused.ExitCode -ne 2) { throw "The ARM installer exited with $($refused.ExitCode) on x64, not 2" }
          }
          $installer = Get-ChildItem dist -Filter "console-editor-*-win-$arch-setup.exe" | Select-Object -First 1
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "The installer exited with $($installed.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Console Editor\Console Editor.exe'
          if (-not (Test-Path $app)) { throw "The installer didn't put the app at $app" }
          npm run test:packaged -- "$app"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Update the installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Console Editor\Console Editor.exe'
          # It checks that the app installed at $app runs the newer version afterwards.
          npm run test:update -- "$app" dist-next
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The installer keeps a copy of itself for the next (differential) update, and uninstalling removes it.
          $cache = Join-Path $env:LOCALAPPDATA 'console-editor-updater'
          if (-not (Test-Path (Join-Path $cache 'installer.exe'))) { throw "No installer copy in $cache" }
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA 'Programs\Console Editor\Uninstall Console Editor.exe') -ArgumentList '/S', '/currentuser' -Wait
          # The uninstaller carries on from a copy of itself in %TEMP%.
          for ($i = 0; $i -lt 60 -and ((Test-Path $app) -or (Test-Path $cache)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw 'Uninstalling left the app' }
          if (Test-Path $cache) { throw "Uninstalling left $cache" }

      # Without relaxing Ubuntu's user-namespace restriction: the package's AppArmor profile has to cover it.
      - name: Install the .deb and test the app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb "./dist/console-editor_$(jq -r .version package.json)_$(dpkg --print-architecture).deb"
          xvfb-run -a npm run test:packaged -- "/opt/Console Editor/console-editor"

      # The AppImage runs where the user put it, with FUSE 2, and has no AppArmor profile: like any
      # AppImage on Ubuntu 24.04, its sandbox needs the user-namespace restriction lifted.
      - name: Update the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libfuse2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          arch=$([ "$(uname -m)" = aarch64 ] && echo arm64 || echo x86_64)
          mkdir -p "$RUNNER_TEMP/apps"
          cp "dist/console-editor-$(jq -r .version package.json)-linux-$arch.AppImage" "$RUNNER_TEMP/apps/"
          chmod +x "$RUNNER_TEMP"/apps/*.AppImage
          xvfb-run -a npm run test:update -- "$(ls "$RUNNER_TEMP"/apps/*.AppImage)" dist-next

      - name: Upload the smoke test's screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: ignore

  release:
    name: Draft the release
    needs: [prepare, test]
    # A pushed tag, or a manual run with the box ticked; never a version that is already out.
    if: (github.event_name == 'push' && needs.prepare.outputs.released != 'true') || inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # This token sees drafts too: never add a second release for the same version.
          if existing=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>&1); then
            echo "::error::v$VERSION already has a release (draft: $existing). Delete it or bump the version."
            exit 1
          elif [[ "$existing" != *"release not found"* ]]; then
            echo "$existing"
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          node --no-warnings scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Console Editor $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
